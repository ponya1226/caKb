name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_GOOGLE_VISION_PROXY_URL: ${{ vars.VITE_GOOGLE_VISION_PROXY_URL }}
      VITE_GOOGLE_SHEETS_PROXY_URL: ${{ vars.VITE_GOOGLE_SHEETS_PROXY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm run test
          npm run test:rules

      - name: Build
        run: npm run build

      - name: Deploy Firestore Rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAKB_DEV }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@14.16.0 deploy --only firestore:rules --project cakb-dev --non-interactive

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAKB_DEV }}
          projectId: cakb-dev
          channelId: live

      - name: Verify deployed application
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://cakb-dev.firebaseapp.com/ \
            | grep '<div id="root"></div>'
